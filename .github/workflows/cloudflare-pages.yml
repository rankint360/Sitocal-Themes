name: Deploy Sitocal themes to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - '**/*-netlify-deploy-v*.zip'
      - 'scripts/build_pages.py'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitocal-themes-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PRODUCTION_ENABLED: ${{ vars.CLOUDFLARE_PRODUCTION_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate all themes
        run: python3 scripts/build_pages.py --output pages-dist
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN as GitHub Actions secrets."
            exit 1
          fi
      - name: Deploy complete theme library
        run: |
          branch=theme-library-preview
          if [ "$PRODUCTION_ENABLED" = "true" ]; then branch=main; fi
          npx --yes wrangler@4.160.1 pages deploy pages-dist --project-name sitocal-themes --branch "$branch"
